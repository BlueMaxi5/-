<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Game Library</title>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }

    function filterGames() {
      let input = document.getElementById('searchBar').value.toLowerCase();
      let cards = document.getElementsByClassName('card');
      for (let i = 0; i < cards.length; i++) {
        let title = cards[i].innerText.toLowerCase();
        cards[i].style.display = title.includes(input) ? "flex" : "none";
      }
    }
  </script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #121212;
      color: #ffffff;
      text-align: center;
      padding: 20px;
      margin: 0;
    }
    #searchBar {
      width: 80%;
      max-width: 400px;
      padding: 12px 20px;
      font-size: 16px;
      border-radius: 20px;
      border: 1px solid #444;
      background-color: #222;
      color: white;
      margin-bottom: 25px;
      outline: none;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 15px;
      max-width: 1000px;
      margin: 0 auto;
    }
    .card {
      background-color: #1e1e1e;
      border: 1px solid #333;
      border-radius: 12px;
      height: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      text-decoration: none;
      font-weight: bold;
      font-size: 16px;
      padding: 10px;
    }
    .card:active {
      transform: scale(0.95);
      background-color: #333;
    }
  </style>
</head>
<body>

  <h1>Game Library</h1>
  <input type="text" id="searchBar" onkeyup="filterGames()" placeholder="Search games...">

  <div class="grid">
    <!-- Add links to all your games here -->
    <a class="card" href="Dash Valley - Mobile Friendly.html">Dash Valley</a>
    <a class="card" href="game2.html">Game Title 2</a>
  </div>

</body>
</html>
